name: orchestrator
on:
  pull_request:
    paths: ["services/**", "supabase/**", "fixtures/**", "tests/**", ".github/workflows/orchestrator.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lanekeeper
      LK_SIGNING_SECRET: ci-signing-secret-0123456789abcdef0123
      LK_DEVICE_LINK_SECRET: ci-device-secret-0123456789abcdef01234
      AI_MODE: offline            # CI never calls billable APIs
      BILLABLE_CALLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-postgres.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml
      - run: pip install -q -e "services/orchestrator[dev]"
      - name: Lint
        run: ruff check services/orchestrator
      - name: Unit, policy, model, graph and simulator tests (offline models, real Postgres)
        run: python -m pytest services/orchestrator/tests -p no:warnings
