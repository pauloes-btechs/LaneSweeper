name: e2e
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lanekeeper
      LK_SIGNING_SECRET: ci-signing-secret-0123456789abcdef0123
      LK_DEVICE_LINK_SECRET: ci-device-secret-0123456789abcdef01234
      LK_DEMO_MODE: "1"
      AI_MODE: offline
      BILLABLE_CALLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-postgres.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/orchestrator/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -q -e services/orchestrator && npm ci --no-audit --no-fund
      - run: ./scripts/db-reset.sh && lanekeeper seed-embeddings
      - name: Start API and console
        run: |
          nohup lanekeeper serve --port 8787 > api.log 2>&1 &
          npm run build -w apps/console
          nohup npx -w apps/console vite preview --port 5173 --host 127.0.0.1 > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health && curl -sf localhost:5173/console >/dev/null && break; sleep 1; done
      - name: Rider → approval → simulated mission → verified ticket → public report
        run: CHROME_PATH=$(which google-chrome) node tests/e2e/rider-to-verified-cleanup.e2e.mjs
      - if: failure()
        run: tail -100 api.log web.log
